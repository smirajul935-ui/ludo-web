<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SagarTech99 - Ludo Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">
        <!-- Setup Screen -->
        <div id="setup-screen" class="screen">
            <h1 class="neon-title">LUDO<span>MULTIPLAYER</span></h1>
            <div class="glass-card">
                <input type="text" id="player-name" placeholder="Enter Nickname" maxlength="10">
                <button id="create-btn" class="btn neon-green">CREATE ROOM</button>
                <div class="divider">OR</div>
                <input type="text" id="room-code-input" placeholder="4-Digit Code" maxlength="4">
                <button id="join-btn" class="btn neon-blue">JOIN ROOM</button>
            </div>
            <div class="brand-footer">SagarTech99</div>
        </div>

        <!-- Lobby Screen -->
        <div id="lobby-screen" class="screen hidden">
            <div class="lobby-card">
                <h2>WAITING FOR PLAYERS</h2>
                <div class="code-banner">
                    <h1 id="display-room-code">----</h1>
                    <span>★</span>
                </div>
                <ul id="player-list"></ul>
                <button id="start-btn" class="btn neon-green hidden">START GAME</button>
                <p class="blink">Waiting for others...</p>
            </div>
            <div class="brand-footer">SagarTech99</div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen hidden">
            <div class="game-header">
                <div class="info-pill">TURN: <span id="current-turn-text">RED</span></div>
                <div class="info-pill">⏱ <span id="timer-val">30</span>s</div>
            </div>

            <div class="board-container">
                <div class="ludo-board" id="ludo-board"></div>
                <div id="tokens-container"></div>
            </div>

            <div class="game-footer">
                <div class="dice-section">
                    <div id="dice-value">1</div>
                    <button id="roll-btn" class="btn-roll">ROLL DICE</button>
                </div>
                <div class="you-info">YOU: <span id="my-color-text">---</span></div>
                <div class="brand-name">SagarTech99</div>
            </div>
        </div>

        <!-- Winner Modal -->
        <div id="winner-modal" class="modal hidden">
            <div class="modal-content">
                <h1 id="winner-text">WINNER! 🎉</h1>
                <button onclick="location.reload()" class="btn neon-green">Play Again</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
