<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SagarTech99 - Online Ludo</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Home Screen -->
        <div id="screen-home" class="screen">
            <h1 class="logo-neon">LUDO<span>MULTIPLAYER</span></h1>
            <div class="glass-card">
                <input type="text" id="player-name" placeholder="Enter Nickname" maxlength="10">
                <button class="btn-neon green" onclick="ui.goto('screen-create')">CREATE TABLE</button>
                <button class="btn-neon blue" onclick="ui.goto('screen-join')">JOIN TABLE</button>
            </div>
            <div class="brand">SagarTech99</div>
        </div>

        <!-- Lobby (Photo 2 Style) -->
        <div id="screen-lobby" class="screen hidden">
            <div class="lobby-box">
                <div class="lobby-header">
                    <div class="users-icon">👥</div>
                    <h2>WAITING FOR PLAYERS</h2>
                    <p>Share Room Code with your friends</p>
                </div>
                <div class="code-box">
                    <h1 id="room-code-display">SAGAR TECH99</h1>
                    <span>★</span>
                </div>
                <div class="player-slots" id="player-list"></div>
                <div id="host-controls" class="hidden">
                    <button class="btn-start" onclick="game.startGame()">▶ START GAME</button>
                </div>
            </div>
        </div>

        <!-- Game Board (Photo 1 Style) -->
        <div id="screen-game" class="screen hidden">
            <div class="game-top">
                <div class="p-badge" id="p-red"><div class="p-icon">👤</div><span id="name-red">---</span></div>
                <div class="p-badge" id="p-green"><div class="p-icon">👤</div><span id="name-green">---</span></div>
            </div>
            
            <div id="board-area">
                <canvas id="ludoCanvas"></canvas>
            </div>

            <div class="game-bottom">
                <div class="p-badge" id="p-blue"><div class="p-icon">👤</div><span id="name-blue">---</span></div>
                <div class="p-badge" id="p-yellow"><div class="p-icon">👤</div><span id="name-yellow">---</span></div>
            </div>

            <div class="controls-area">
                <div id="dice-container" onclick="game.rollDice()">
                    <div id="dice-cube" class="dice">?</div>
                </div>
                <div class="branding">SagarTech99</div>
            </div>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script src="game-engine.js"></script>
</body>
</html>
