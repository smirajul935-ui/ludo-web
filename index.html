<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Professional Ludo</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

    <div id="app">
        <!-- 1. Home Screen -->
        <div id="screen-home" class="screen">
            <h1 class="title">LUDO<span>ONLINE</span></h1>
            <input type="text" id="player-name" placeholder="Enter Nickname" maxlength="12">
            <button class="btn primary" onclick="ui.showCreate()">CREATE ROOM</button>
            <button class="btn secondary" onclick="ui.showJoin()">JOIN ROOM</button>
        </div>

        <!-- 2. Create Room Selection -->
        <div id="screen-create" class="screen hidden">
            <h2>Select Players</h2>
            <div class="option-row">
                <button onclick="game.setPlayers(2)">2 Players</button>
                <button onclick="game.setPlayers(4)">4 Players</button>
            </div>
            <p id="p-count">Mode: 2 Players</p>
            <button class="btn success" onclick="game.startCreating()">START LOBBY</button>
            <button class="btn-text" onclick="ui.showHome()">Back</button>
        </div>

        <!-- 3. Join Room -->
        <div id="screen-join" class="screen hidden">
            <h2>Join Room</h2>
            <input type="text" id="join-code" placeholder="6-Digit Code">
            <button class="btn success" onclick="game.joinRoom()">JOIN NOW</button>
            <button class="btn-text" onclick="ui.showHome()">Back</button>
        </div>

        <!-- 4. Lobby -->
        <div id="screen-lobby" class="screen hidden">
            <div class="room-card">
                <p>ROOM CODE</p>
                <h1 id="room-id-display">------</h1>
            </div>
            <div id="player-list" class="player-grid"></div>
            <div id="host-controls" class="hidden">
                <button class="btn success" onclick="game.startGame()">START GAME</button>
            </div>
            <p id="wait-msg" class="pulse">Waiting for host to start...</p>
        </div>

        <!-- 5. Game Screen -->
        <div id="screen-game" class="screen hidden">
            <div class="game-header">
                <span id="turn-indicator">Your Turn</span>
                <span id="timer">30s</span>
            </div>
            <div id="board-container">
                <canvas id="ludoCanvas"></canvas>
            </div>
            <div class="game-footer">
                <div id="dice-box" onclick="game.rollDice()">?</div>
                <p id="status-msg">Tap dice to roll</p>
            </div>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script src="game-engine.js"></script>
</body>
</html>
