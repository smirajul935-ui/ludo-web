<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ludo Online Multiplayer</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>
    <!-- Home Screen -->
    <div id="screen-home" class="screen">
        <h1 class="logo-text">LUDO ONLINE</h1>
        <div class="input-group">
            <input type="text" id="player-name" placeholder="Enter Name" maxlength="10">
            <button class="btn-main" onclick="game.createRoom()">CREATE ROOM</button>
            <button class="btn-main" onclick="ui.showJoin()">JOIN ROOM</button>
        </div>
    </div>

    <!-- Create Room Selection -->
    <div id="screen-create-select" class="screen hidden">
        <h2>Select Players</h2>
        <button onclick="game.setPlayers(2)">2 Players</button>
        <button onclick="game.setPlayers(4)">4 Players</button>
        <p id="p-count">Selected: 2</p>
        <button class="btn-confirm" onclick="game.startCreating()">START LOBBY</button>
    </div>

    <!-- Join Screen -->
    <div id="screen-join" class="screen hidden">
        <h2>Join Room</h2>
        <input type="text" id="join-code" placeholder="Enter 6-Digit Code">
        <button class="btn-confirm" onclick="game.joinRoom()">JOIN NOW</button>
        <button onclick="ui.showHome()">BACK</button>
    </div>

    <!-- Lobby -->
    <div id="screen-lobby" class="screen hidden">
        <h2 id="room-id-display">CODE: ------</h2>
        <div id="player-list"></div>
        <div id="host-controls" class="hidden">
            <button class="btn-confirm" onclick="game.startGame()">START GAME</button>
        </div>
        <p id="wait-msg">Waiting for host...</p>
    </div>

    <!-- Game Screen -->
    <div id="screen-game" class="screen hidden">
        <div class="game-info">
            <span id="turn-name">Turn: ---</span>
            <span id="timer">30</span>
        </div>
        <div id="board-container">
            <canvas id="ludoCanvas"></canvas>
        </div>
        <div class="controls">
            <div id="dice-box" onclick="game.rollDice()">?</div>
            <p id="game-status">Click Dice!</p>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script src="game-engine.js"></script>
</body>
</html>
